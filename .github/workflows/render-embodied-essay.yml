name: Render Embodied Audio Essay (Piper VITS + Guardrails)

on:
  workflow_dispatch:
    inputs:
      voice_a:
        description: "Speaker A voice (Attenborough + Nye register)"
        required: true
        default: "en_GB-alan-medium"
      voice_b:
        description: "Speaker B voice (Social Model + Scholl + Sagan register)"
        required: true
        default: "en_GB-alba-medium"
      length_scale:
        description: "Unhurried Roundhouse cadence (1.30 = calm reflective pace)"
        required: true
        default: "1.30"

permissions:
  contents: read

jobs:
  render-embodied-essay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run phonetic & anti-sycophancy guardrail unit tests
        run: |
          PYTHONPATH=nondual-embodied-studio python3 -m unittest nondual-embodied-studio/test_guardrails.py

      - name: Install piper-tts neural runtime
        run: |
          pip install --upgrade pip
          pip install piper-tts

      - name: Synthesize dual-voice essay with Roundhouse pauses & <= 680 Hz stillness bed
        run: |
          mkdir -p nondual-embodied-studio/models nondual-embodied-studio/output
          cd nondual-embodied-studio/models
          VA="${{ github.event.inputs.voice_a }}"
          VB="${{ github.event.inputs.voice_b }}"
          SCALE="${{ github.event.inputs.length_scale }}"
          python3 -m piper.download_voices --download-dir . "$VA" "$VB"
          python3 ../render_embodied_essay.py \
            ../scripts/zenodo-24393275-dialogue.json \
            "${VA}.onnx" \
            "${VB}.onnx" \
            ../output/zenodo-24393275-embodied.wav \
            "$SCALE"

      - name: Upload rendered WAV artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-24393275-embodied-audio
          path: nondual-embodied-studio/output/zenodo-24393275-embodied.wav
          retention-days: 14
